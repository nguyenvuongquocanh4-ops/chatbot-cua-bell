<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Chatbot</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="chat-container">

        <div class="header">
            <div class="avatar">🤖</div>

            <div>
                <h1>AI thông minh hơn chatgpt</h1>
                <p>Gemini AI</p>
            </div>
        </div>


        <div id="chat-box" class="chat-box">

            <div class="message bot">
                <div class="bubble">
                    Xin chào! 👋<br>
                    Tôi là AI do BELL tạo ra. Bạn muốn hỏi gì?
                </div>
            </div>

        </div>


       <div id="typing" class="typing">
    <span></span>
    <span></span>
    <span></span>
</div>

        <form id="chat-form" class="input-area">

            <input
                id="message-input"
                type="text"
                placeholder="Nhập tin nhắn..."
                autocomplete="off"
            >

            <button type="submit">
                Gửi
            </button>

        </form>

    </div>
<script>
window.MathJax = {
    tex: {
        inlineMath: [['\\(', '\\)']],
        displayMath: [['$$', '$$'], ['\\[', '\\]']]
    },
    svg: {
        fontCache: 'global'
    }
};
</script>

<script
    src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js">
</script>

<script src="script.js"></script>

    <script src="script.js"></script>

</body>
</html>
